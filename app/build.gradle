def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
def releaseStoreFile = System.getenv('SM64_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('SM64_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('SM64_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SM64_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    compileSdkVersion 26
    signingConfigs {
        if (hasReleaseSigning) {
            handheldRelease {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.vdavid003.sm64port"
        }
        minSdkVersion 26
        targetSdkVersion 26
        versionCode 4
        versionName "0.4-handheld"
        externalNativeBuild {
            ndkBuild {
                arguments "-j4", "APP_PLATFORM=android-16"
                abiFilters 'arm64-v8a'
            }
            // cmake {
            //     arguments "-DANDROID_APP_PLATFORM=android-16", "-DANDROID_STL=c++_static"
            //     // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            //     abiFilters 'arm64-v8a'
            // }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.handheldRelease
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
            // cmake {
            //     path 'jni/CMakeLists.txt'
            // }
        }
       
    }
    lintOptions {
        abortOnError false
    }
    
    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "com.vdavid003.sm64port.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation('org.apache.commons:commons-compress:1.19') {
        exclude group: 'org.tukaani', module: 'xz'
    }
    // Keep versions compatible with the inherited AGP 3.2 Android toolchain.
    implementation 'org.tukaani:xz:1.9'
}
